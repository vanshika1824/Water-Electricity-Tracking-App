name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/auth-and-consumption-forms
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'

jobs:
  build-apk:
    name: Build AquaWatt Debug APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache

      - name: Cache Buildozer Global Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ runner.os }}-${{ hashFiles('mobile/buildozer.spec') }}
          restore-keys: |
            buildozer-global-${{ runner.os }}-

      - name: Install Python Build Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade "buildozer>=1.5.0" "cython<3.1" virtualenv

      - name: Build Android APK with Buildozer
        working-directory: mobile
        run: |
          buildozer -v android debug

      - name: Verify Generated APK
        working-directory: mobile
        run: |
          echo "=== Built Artifacts in mobile/bin ==="
          ls -la bin/
          test -f bin/*.apk || (echo "ERROR: No APK was generated in mobile/bin/" && exit 1)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AquaWatt-Android-APK
          path: mobile/bin/*.apk
          if-no-files-found: error
          retention-days: 30
